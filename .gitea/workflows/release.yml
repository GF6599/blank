name: Release

on:
  push:
    tags:
      - "🚀release.*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate tag format
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^🚀release\.[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Tag '$tag' does not match 🚀release.yyyy.mm.dd"
            exit 1
          fi

      - name: Build release binaries
        run: |
          mkdir -p dist/linux dist/darwin dist/windows
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              suffix=""
              if [ "$goos" = "windows" ]; then
                suffix=".exe"
              fi
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build -mod=readonly -trimpath -ldflags "-s -w" \
                -o "dist/${goos}/blank-${goos}-${goarch}${suffix}" .
            done
          done

      - name: Generate checksums
        run: |
          for goos in linux darwin windows; do
            cd "dist/${goos}"
            sha256sum blank-* > "SHA256SUMS-${goos}"
            cd -
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blank-linux-${{ github.ref_name }}
          path: dist/linux/*

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blank-darwin-${{ github.ref_name }}
          path: dist/darwin/*

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blank-windows-${{ github.ref_name }}
          path: dist/windows/*

      - name: Publish GitHub release
        uses: gitea.com/actions/release-action@v1
        with:
          api_key: ${{ secrets.GITEA_TOKEN }}
          files: |
            dist/linux/blank-*
            dist/linux/SHA256SUMS-linux
            dist/darwin/blank-*
            dist/darwin/SHA256SUMS-darwin
            dist/windows/blank-*
            dist/windows/SHA256SUMS-windows
