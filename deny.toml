[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]

[licenses]
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "deny"
skip = [
    { crate = "syn@2", reason = "compile-time only, until derive_more and strum_macros move to syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
