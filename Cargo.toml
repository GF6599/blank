[package]
name = "blank"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Destroy files and directories so that the contents cannot be recovered"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31.3", default-features = false, features = ["fs", "signal", "user"] }
rand = "0.10.3"
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
