[package]
name = "blank"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Destroy files and directories so that the contents cannot be recovered"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
icu_properties = "2.3.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
nix = { version = "0.31.3", default-features = false, features = ["fs", "signal", "user"] }
rand = "0.10.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
rustix = { version = "1.1.5", features = ["fs"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
unicode-width = "0.2.2"

[dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = ["term"] }
tempfile = "3.27.0"
